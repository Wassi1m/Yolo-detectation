[project]
name = "fall-detection"
version = "0.1.0"
requires-python = ">=3.9"
description = "Frame-level fall detection with YOLO26"
dependencies = [
	"matplotlib>=3.8",
	"numpy>=1.26",
	"opencv-python>=4.9",
	"pandas>=2.2",
	"pyyaml>=6.0",
	"ultralytics>=8.3.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fall-detection = "fall_detection.runner:main"
fall-detection-eval = "fall_detection.evaluate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]