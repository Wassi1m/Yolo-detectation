[project]
name = "posture-load-estimation"
version = "0.1.0"
requires-python = ">=3.9"
description = "YOLO26 pose estimation and posture indicators"
dependencies = [
	"matplotlib>=3.8",
	"numpy>=1.26",
	"opencv-python>=4.9",
	"pandas>=2.2",
	"pyyaml>=6.0",
	"ultralytics>=8.3.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
posture-load = "posture_load.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]